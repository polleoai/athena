name: Release

# Builds the Athena plugin in CI, signs each release asset with a sigstore
# build provenance attestation, and attaches the assets to the GitHub
# Release for a tag. Two triggers:
#
#   1. push:        when a release tag is pushed to polleoai/athena, the
#                   workflow fires automatically and uses the pushed tag.
#                   This is the normal path for new releases.
#
#   2. workflow_dispatch: a maintainer can manually fire the workflow
#                   against an existing tag (e.g., to retroactively attest
#                   a release whose initial tag push didn't fire the
#                   workflow because the workflow file was introduced in
#                   the same commit — GitHub's first-run chicken-and-egg).
#                   Provide the tag as the "tag" input.
#
# Why this exists: Obsidian's Community Plugins scorecard flags release
# assets that are missing GitHub artifact attestations. Locally-uploaded
# assets can't be meaningfully attested (the trust model wants "this binary
# was produced by this workflow from this commit"), so the build is owned
# by CI.
#
# Tag format follows Obsidian's rule: bare semver, no leading "v" (1.0.0,
# not v1.0.0).
#
# Release ownership: this workflow OWNS the release body and asset files
# for any tag it processes. On workflow_dispatch re-runs against an
# existing release, the body is replaced by the matching CHANGELOG slice
# and the named assets (main.js, manifest.json, styles.css, install zip)
# are re-uploaded with sigstore attestations. Any handcrafted edits to a
# release body or those asset files will be reverted by the next run —
# do not maintain release content manually.
#
# Security notes: every run: block uses $TAG_NAME (env-var form, derived
# from controlled sources — either a pushed Git tag, which Git constrains
# to a safe character set, or the workflow_dispatch input, which only a
# repo maintainer can supply). The Validate-TAG_NAME-shape step rejects
# any tag value that doesn't match the bare-semver-plus-optional-suffix
# shape, defending against typos in workflow_dispatch inputs and against
# any regex-metachar splice into the awk pattern that extracts CHANGELOG
# release notes. Values from controlled files (CHANGELOG, manifest) are
# also used. No user-controlled event payload is spliced into a shell.

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'  # pre-release tags (rc1, rc2, …)
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re-)build and attest, e.g. 1.0.0'
        required: true
        type: string

permissions:
  contents: write       # create/update the GitHub Release
  id-token: write       # OIDC token used for sigstore signing
  attestations: write   # publish the attestation to GitHub

env:
  TAG_NAME: ${{ github.event.inputs.tag || github.ref_name }}
  # GitHub forces Node 24 for JavaScript actions on 2026-06-02. Opt in
  # now so the deprecation warning goes quiet and we don't get caught
  # by the cut-over. Static value; no untrusted input involved.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-and-release:
    # Releases are published from polleoai/athena only. jivebug/athena is the
    # dev repo: it carries the same tags (tag-on-bump-merge.yml) and, now that
    # Athena is at its root, GitHub would otherwise run this workflow there too
    # and publish a signed release from the dev repo on every tag.
    if: github.repository == 'polleoai/athena'
    runs-on: ubuntu-latest
    steps:
      - name: Validate TAG_NAME shape
        run: |
          if ! echo "$TAG_NAME" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[A-Za-z0-9.]+)?$'; then
            echo "TAG_NAME '$TAG_NAME' does not match expected semver shape (X.Y.Z or X.Y.Z-suffix; no leading zeros)"
            exit 1
          fi
          echo "TAG_NAME validated: $TAG_NAME"

      - name: Guard — Gryphon submodule pin must be released (on polleoai/gryphon)
        # The dev auto-fix loop (gryphon-autofix-loop) can pin vendor/gryphon to
        # a jivebug/gryphon-dev commit that was never released to polleoai. A
        # public release's submodule (.gitmodules -> polleoai/gryphon) cannot
        # resolve such a pin, so the checkout-with-submodules step below would
        # fail cryptically. Fail fast and clearly BEFORE that. Release is
        # deliberately OUT of the auto-fix loop; this is the CI safety net
        # (mirror of scripts/assert-gryphon-released.sh for the local path).
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PIN=$(gh api "repos/${GITHUB_REPOSITORY}/contents/vendor/gryphon?ref=${TAG_NAME}" --jq '.sha')
          echo "Pinned vendor/gryphon = $PIN"
          if gh api "repos/polleoai/gryphon/commits/${PIN}" >/dev/null 2>&1; then
            echo "✓ released — pinned commit is present on polleoai/gryphon"
          else
            echo "✗ pinned Gryphon commit ${PIN} is NOT on polleoai/gryphon (dev-only)."
            echo "  Re-pin vendor/gryphon to a released Gryphon tag before releasing Athena."
            exit 1
          fi

      - name: Checkout the tagged commit (with submodules)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG_NAME }}
          submodules: recursive
          fetch-depth: 0

      # The step above proves the PINNED COMMIT is released. This one proves our
      # two records of that pin agree: the submodule gitlink and the plain
      # vendor/gryphon.pin that a no-git build reads. Both gates are needed and
      # neither sees the other's failure — a drifted pin passes the released
      # check (the submodule is fine) while shipping a different Gryphon to
      # anyone building from a source archive.
      - name: Assert vendor/gryphon.pin matches the submodule
        run: node scripts/sync-gryphon-pin.js --check

      # Obsidian picks what an OLDER app may install from versions.json: the
      # highest entry whose minimum the app meets, downloaded from this repo's
      # releases. So this tag must be recorded at the manifest's minAppVersion,
      # no entry may under-declare its floor, and every other entry must be a
      # real public release (else that download 404s). #230: every entry said
      # "1.0.0" and nothing past 1.8.3 was recorded, so Obsidian 1.0–1.4.3 was
      # offered builds that throw on the standalone setTooltip.
      - name: Gate — versions.json declares this release honestly
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list -R "$GITHUB_REPOSITORY" --limit 1000 --json tagName --jq '.[].tagName' > "$RUNNER_TEMP/public-releases.txt"
          node scripts/versions-json.js --check --release "$TAG_NAME" --known-releases "$RUNNER_TEMP/public-releases.txt"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (clean, deterministic)
        run: |
          npm ci
          (cd vendor/gryphon && npm ci --include=dev)

      - name: Build plugin bundle
        run: npm run build:all

      - name: Verify build outputs are present
        run: |
          test -f .obsidian/plugins/athena/main.js       || { echo "main.js missing after build"; exit 1; }
          test -f .obsidian/plugins/athena/manifest.json || { echo "manifest.json missing after build"; exit 1; }
          test -f .obsidian/plugins/athena/styles.css    || { echo "styles.css missing after build"; exit 1; }
          ls -la .obsidian/plugins/athena/

      - name: Verify tag matches manifest.version
        run: |
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          if [ "$TAG_NAME" != "$MANIFEST_VERSION" ]; then
            echo "Tag $TAG_NAME does not match manifest.version $MANIFEST_VERSION"
            exit 1
          fi
          echo "Tag and manifest agree on version: $TAG_NAME"

      - name: Stage release assets at repo root
        run: |
          # Obsidian's Community Plugins directory only downloads
          # main.js, manifest.json, and styles.css from the GitHub
          # Release. Per the directory's automated review (2026-05-18),
          # additional release assets like a bundled install zip trigger
          # a "Recommendation" warning and are never fetched by users.
          # So we ship only the three supported files.
          #
          # NOTE: The Python backend (bin/lib/wiki_page.py etc.) IS
          # required for full synthesis but is NOT shipped via the
          # GitHub Release — users who want it clone polleoai/athena
          # for the full source tree. The plugin still bootstraps as
          # capture-only without Python backend, and as full-synthesis
          # when the user has Python + bin/ checked out alongside.
          cp .obsidian/plugins/athena/main.js       main.js
          cp .obsidian/plugins/athena/manifest.json manifest.json
          cp .obsidian/plugins/athena/styles.css    styles.css

      - name: Attest build provenance for release assets
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          awk -v ver="$TAG_NAME" '
            $0 ~ "^## \\[" ver "\\]" { capture = 1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          # Fall back to a minimal default note when no `## [X.Y.Z]`
          # section exists. Auto-bump tags (e.g. Gryphon vendor bumps)
          # don't ship with a curated changelog entry; before this
          # fallback they exit 1 and the release never gets created.
          # The default points users at the commit log + full CHANGELOG
          # so the release is still informative.
          if [ ! -s /tmp/release-notes.md ]; then
            echo "No \`## [$TAG_NAME]\` section in CHANGELOG.md — generating default release notes." >&2
            {
              echo "Release $TAG_NAME."
              echo
              echo "This release has no curated CHANGELOG section (typically an auto-bump tag — e.g. a Gryphon vendor pin update). See:"
              echo
              echo "- The full [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/$TAG_NAME/CHANGELOG.md) for context on surrounding releases"
              echo "- The commit history at [${TAG_NAME}](https://github.com/${GITHUB_REPOSITORY}/commits/$TAG_NAME) for the exact change set"
            } > /tmp/release-notes.md
          fi
          echo "notes-file=/tmp/release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Create or update the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "Athena ${{ env.TAG_NAME }}"
          body_path: ${{ steps.notes.outputs.notes-file }}
          prerelease: ${{ contains(env.TAG_NAME, '-') }}
          files: |
            main.js
            manifest.json
            styles.css

  # npm: @polleoai/athena is staged for the maintainer to approve (npm "staged
  # publishing": nothing is installable until a maintainer approves it with
  # 2FA — `npm stage approve <id>` or npmjs.com). Same shape as Gryphon's.
  #
  # Two jobs, so the publishing credential never meets project code:
  #   npm-build  — no id-token, and no dependency install or build at all: it
  #                takes main.js / manifest.json / styles.css from the GitHub
  #                Release the job above just signed, packs the package with
  #                scripts/npm-pack.mjs, and checks it file for file against
  #                .github/npm-manifest.json (the record the release session
  #                wrote from the package it built and checked). Hands over
  #                only the verified tarball.
  #   npm-stage  — id-token for npm trusted publishing (OIDC: no stored token;
  #                npm accepts this workflow in this repo only). No checkout:
  #                it downloads the verified tarball and stages it.
  #
  # Both run only for a pushed X.Y.Z tag — never a pre-release tag, never a
  # workflow_dispatch re-run. A version already on npm is skipped; a version
  # staged but not yet approved isn't visible to `npm view`, so approve or
  # reject it before re-running, or the re-stage fails.
  npm-build:
    needs: build-and-release
    if: ${{ github.repository == 'polleoai/athena' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-') }}
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout the tagged commit (no submodules — nothing is built here)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.ref }}

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Take the plugin files from the signed GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" -p main.js -p manifest.json -p styles.css --clobber
          git diff --exit-code -- manifest.json || { echo "::error::released manifest.json differs from the tag's"; exit 1; }

      - name: Pack and check against the release record
        run: |
          test -f .github/npm-manifest.json || { echo "::error::.github/npm-manifest.json missing — this release wasn't cut with npm staging"; exit 1; }
          node scripts/npm-pack.mjs --out "$RUNNER_TEMP/npm" --verify .github/npm-manifest.json --version "$RELEASE_TAG"

      - name: Record the tarball's integrity (matches npm's dist.integrity once approved)
        run: |
          for t in "$RUNNER_TEMP"/npm/*.tgz; do
            echo "$(basename "$t") sha512-$(openssl dgst -sha512 -binary "$t" | base64 -w0)"
          done

      - name: Hand over the verified tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-tarball
          path: ${{ runner.temp }}/npm/*.tgz
          if-no-files-found: error
          retention-days: 7

  npm-stage:
    needs: npm-build
    # GitHub enforces this environment's rule (deployments only from tags
    # shaped X.Y.Z) and npm's trusted publisher requires it, so an edited copy
    # of this workflow run from a branch can't stage anything.
    environment: npm
    if: ${{ github.repository == 'polleoai/athena' && github.event_name == 'push' }}
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC token for npm trusted publishing — this job only
    steps:
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: npm with trusted publishing and staging (11.5.1+)
        run: |
          npm install -g npm@11.21.0
          npm --version

      - name: Fetch the verified tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-tarball
          path: ${{ runner.temp }}/npm

      - name: Stage on npm
        run: |
          set -euo pipefail
          staged=0
          for tgz in "$RUNNER_TEMP"/npm/*.tgz; do
            name=$(tar -xzOf "$tgz" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).name')
            # 404 = not published yet; any other failure stops the job rather
            # than being read as "not there".
            if out=$(npm view "$name@$RELEASE_TAG" version 2>&1); then
              echo "$name@$RELEASE_TAG is already on npm — skipped"
              continue
            elif ! grep -q "E404" <<<"$out"; then
              echo "Couldn't check $name@$RELEASE_TAG on npm:"; echo "$out"; exit 1
            fi
            npm stage publish "$tgz"
            staged=$((staged + 1))
          done
          echo "Staged $staged package(s) for $RELEASE_TAG. Approve with: npm stage list, then npm stage approve <id>"
